services:
  db:
    image: postgres:16-alpine
    container_name: gestion_scolaire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestion_scolaire}
      POSTGRES_USER: ${DB_USER:-gestion_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestion_secret_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V001__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/development_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestion_app} -d ${DB_NAME:-gestion_scolaire}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
